name: Bug Report
description: Report a reproducible Agent Studio bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: List the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Start the stack with ...
        2. Visit ...
        3. Run ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, commit SHA, or branch.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, Node version, Python version, deployment target.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Remove secrets before submitting.
      render: shell
